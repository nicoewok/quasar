[package]
name = "quasar"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = { version = "0.19", features = ["spirv"] }
winit = "0.29"
shaderc = "0.8"
cpal = "0.15"
realfft = "3.3"
ringbuf = "0.3"
notify = "6.1"
directories = "5.0"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.3"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.8"
